name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH Password Auth
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 5m
          command_timeout: 15m
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/www/server/nodejs/v20.18.0/bin:~/.nvm/versions/node/v20.18.0/bin
            cd /www/wwwroot/manushatrupafoundation.net || exit 0
            
            git fetch origin main || true
            git reset --hard origin/main || true
            
            npm install || true
            node scripts/init-db.js || true
            npm run build || true
            
            (pm2 restart ecosystem.config.cjs || pm2 start ecosystem.config.cjs) || true
            pm2 save || true
