name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 5m
          command_timeout: 15m
          script: |
            set -e
            cd /www/wwwroot/manushatrupafoundation.net
            
            # Pull & clean untracked changes
            git fetch origin main
            git reset --hard origin/main
            
            # Install dependencies & DB init
            npm install
            node scripts/init-db.js
            npm run build
            
            # Restart PM2 web app & daemon
            pm2 restart ecosystem.config.cjs || pm2 start ecosystem.config.cjs || true
            pm2 save || true
