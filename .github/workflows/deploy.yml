name: CI & Deployment Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Verification Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

  deploy:
    name: Deploy to VPS Server
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: SSH & Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: false
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin
            cd /www/wwwroot/manushatrupafoundation.net || exit 0
            git pull origin main
            npm install || true
            node scripts/init-db.js || true
            npm run build || true
            pm2 restart ecosystem.config.cjs || pm2 start ecosystem.config.cjs || true
